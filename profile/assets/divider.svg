<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 16" width="100%" height="16">
  <defs>
    <linearGradient id="pulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .runner { animation: slide 3.8s ease-in-out infinite; }
    @keyframes slide {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(1200px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .runner { animation: none !important; transform: translateX(450px); }
    }
  </style>
  <rect x="0" y="7" width="1200" height="2" rx="1" fill="#1E293B"/>
  <rect class="runner" x="0" y="6" width="300" height="4" rx="2" fill="url(#pulseLine)"/>
</svg>
