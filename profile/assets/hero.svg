<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280" role="img" aria-label="ctdoteam1110 banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .orb { animation: floatOrb 6s ease-in-out infinite alternate; }
    .orb2 { animation: floatOrb2 7s ease-in-out infinite alternate; }
    .scanline { animation: scanMove 4.5s linear infinite; }
    .cursor { animation: blink 1s step-end infinite; }
    .fade1 { animation: fadeUp 0.7s ease-out both; }
    .fade2 { animation: fadeUp 0.7s ease-out 0.2s both; }
    .fade3 { animation: fadeUp 0.7s ease-out 0.4s both; }
    .pulseDot { animation: pulse 2s ease-in-out infinite; }
    @keyframes floatOrb {
      0% { transform: translate(0px, 0px); }
      100% { transform: translate(30px, 16px); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px); }
      100% { transform: translate(-25px, -18px); }
    }
    @keyframes scanMove {
      0% { transform: translateX(-400px); }
      100% { transform: translateX(1200px); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; r: 4.5; }
      50% { opacity: 0.45; r: 6.5; }
    }
    @media (prefers-reduced-motion: reduce) {
      .orb, .orb2, .scanline, .cursor, .fade1, .fade2, .fade3, .pulseDot {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>
  <rect class="orb" width="1200" height="280" rx="16" fill="url(#glow1)"/>
  <rect class="orb2" width="1200" height="280" rx="16" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="16" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Top terminal bar -->
  <circle cx="32" cy="28" r="5" fill="#EF4444" fill-opacity="0.85"/>
  <circle cx="50" cy="28" r="5" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="68" cy="28" r="5" fill="#22C55E" fill-opacity="0.85"/>
  <text x="92" y="32" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">ctdoteam1110@github:~/workspace</text>

  <!-- Status pill -->
  <rect x="1030" y="16" width="142" height="24" rx="12" fill="#1B2336" stroke="#334155" stroke-width="1"/>
  <circle class="pulseDot" cx="1048" cy="28" r="4.5" fill="#22C55E"/>
  <text x="1062" y="32" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">ACTIVE TEAM</text>

  <!-- Main Title -->
  <g class="fade1">
    <text x="600" y="132" text-anchor="middle" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="56" font-weight="700" letter-spacing="2" filter="url(#neon)">ctdoteam1110</text>
  </g>

  <!-- Terminal command subtitle -->
  <g class="fade2">
    <text x="600" y="176" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">
      <tspan fill="#22C55E" font-weight="700">$</tspan> build --fast --clean --open-source<tspan class="cursor" fill="#22C55E">_</tspan>
    </text>
  </g>

  <!-- Tech pills -->
  <g class="fade3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">
    <rect x="430" y="206" width="84" height="26" rx="13" fill="#1B2336" stroke="#22C55E" stroke-opacity="0.5"/>
    <text x="472" y="223" text-anchor="middle" fill="#22C55E">RUST</text>

    <rect x="526" y="206" width="148" height="26" rx="13" fill="#1B2336" stroke="#38BDF8" stroke-opacity="0.5"/>
    <text x="600" y="223" text-anchor="middle" fill="#38BDF8">SYSTEMS &amp; TOOLS</text>

    <rect x="686" y="206" width="84" height="26" rx="13" fill="#1B2336" stroke="#A855F7" stroke-opacity="0.5"/>
    <text x="728" y="223" text-anchor="middle" fill="#C084FC">CI / CD</text>
  </g>

  <!-- Animated bottom scanline -->
  <rect class="scanline" x="0" y="277" width="400" height="3" fill="url(#scan)"/>
</svg>
